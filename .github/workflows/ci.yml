name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - docs/**
      - LICENSE
      - "*.example"
  push:
    branches: [main]
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Core tests
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup
        uses: ./.github/actions/setup
      - run: just test

  build:
    name: Device build
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup
      - &cache-config
        name: Configure compilation cache
        id: compiler
        run: |
          xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')
          echo "xcode=xcode-$xcode-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
          # ui-smoke runs App tests' build-for-testing and never runs on main, so it reads App tests' entry.
          echo "prefix=xcode-$xcode-$RUNNER_ARCH-${GITHUB_JOB/#ui-smoke/app-tests}" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/compile-cache.xcconfig" <<'EOF'
          COMPILATION_CACHE_ENABLE_CACHING = YES
          COMPILATION_CACHE_KEEP_CAS_DIRECTORY = YES
          EOF
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/compile-cache.xcconfig" >> "$GITHUB_ENV"
      # Packages only, never Products: a stale checkout cannot make a build pass, a stale binary could.
      - &package-cache
        name: Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: ${{ steps.compiler.outputs.xcode }}-packages-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ steps.compiler.outputs.xcode }}-packages-
      # Pull requests only read it, so each PR commit does not add a several-hundred-MB entry.
      - &compile-cache
        name: Restore compilation cache
        id: compile-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/CompilationCache.noindex
          key: ${{ steps.compiler.outputs.prefix }}-${{ hashFiles('project.yml', 'Config.xcconfig', '**/Package.resolved', 'HeyDanCore/Package.swift', 'justfile', 'scripts/sim_tests.py', '**/*.swift', '!build/**') }}
          restore-keys: |
            ${{ steps.compiler.outputs.prefix }}-
      - run: just build
      - name: Beta variant build
        run: xcodebuild -project HeyDan.xcodeproj -scheme HeyDan -destination 'generic/platform=iOS' -derivedDataPath build -xcconfig Beta.xcconfig CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
      - &compile-cache-save
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/CompilationCache.noindex
          key: ${{ steps.compile-cache.outputs.cache-primary-key }}

  app-tests:
    name: App tests
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      # No CLI grants notification permission on a Simulator that never ran the app (AGENTS.md); this test needs it.
      HEYDAN_SKIP_TESTS: HeyDanTests/MessageNotificationTests/communicationNotificationsAreEntitled()
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          simulator: true
      - *cache-config
      - *package-cache
      - *compile-cache
      - run: just app-test
      - *compile-cache-save

  # The smoke set of UI checks (SMOKE in scripts/sim_tests.py) on pull requests and by hand, not again on the push to
  # main. The full set runs locally (AGENTS.md). ChatPushChecks never runs on CI: it needs notification permission,
  # which no CLI grants on a Simulator that never ran the app, and a real bundle ID.
  ui-smoke:
    name: UI smoke
    if: github.event_name != 'push'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      HEYDAN_RETRY: "1"
      # The script's own budget, under the job's 20 minutes: out of time ends red with what passed.
      HEYDAN_DEADLINE: "1080"
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          simulator: true
      - *cache-config
      - *package-cache
      - *compile-cache
      - run: just sim-checks smoke
      - if: (failure() || cancelled())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-screenshots
          path: build/checks
          if-no-files-found: ignore
          retention-days: 7
