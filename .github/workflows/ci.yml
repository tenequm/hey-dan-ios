name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - docs/**
      - LICENSE
      - "*.example"
  push:
    branches: [main]
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Core tests
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup
        uses: ./.github/actions/setup
      - run: just test

  build:
    name: Device build
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup
      - &cache-config
        name: Configure compilation cache
        id: compiler
        run: |
          xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')
          echo "prefix=xcode-$xcode-$RUNNER_ARCH-$GITHUB_JOB" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/compile-cache.xcconfig" <<'EOF'
          COMPILATION_CACHE_ENABLE_CACHING = YES
          COMPILATION_CACHE_KEEP_CAS_DIRECTORY = YES
          EOF
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/compile-cache.xcconfig" >> "$GITHUB_ENV"
      - &compile-cache
        name: Restore compilation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/CompilationCache.noindex
          key: ${{ steps.compiler.outputs.prefix }}-${{ hashFiles('project.yml', 'Config.xcconfig', '**/Package.resolved', 'HeyDanCore/Package.swift', 'justfile', 'scripts/sim_tests.py', '**/*.swift') }}
          restore-keys: |
            ${{ steps.compiler.outputs.prefix }}-
      - run: just build
      - name: Beta variant build
        run: xcodebuild -project HeyDan.xcodeproj -scheme HeyDan -destination 'generic/platform=iOS' -derivedDataPath build -xcconfig Beta.xcconfig CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

  # Builds the Simulator test products once; the shards below only install and run them.
  sim-build:
    name: Simulator build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          simulator: true
      - *cache-config
      - *compile-cache
      - run: python3 scripts/sim_tests.py build "Hey Dan iPhone" build com.example.HeyDan
      # tar keeps the modification times the reuse check compares against the key file.
      - run: tar -cf "$RUNNER_TEMP/sim-products.tar" build/Build/Products build/HeyDanSimulatorTests.key
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-products
          path: ${{ runner.temp }}/sim-products.tar
          compression-level: 1
          retention-days: 1

  sim-tests:
    name: ${{ matrix.name }}
    needs: sim-build
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: App tests
            mode: app-test
          - name: UI checks (calls)
            mode: sim-checks
            checks: ChatCallChecks
          - name: UI checks (voices, pairing, screens)
            mode: sim-checks
            checks: PairedVoiceChecks ChatPairingChecks ScreenCaptureChecks
          - name: UI checks (threads, composer, settings)
            mode: sim-checks
            # ChatChecks' other tests need a local nanoclaw stack or a test pairing (secrets); ChatPushChecks needs
            # notification permission, which no CLI grants on a Simulator that never ran the app, and a real bundle ID.
            checks: ChatThreadChecks ChatComposerChecks ChatAgentSettingsChecks HeyDanChecks ChatChecks/testFixtureUnreadRelaunch
    env:
      HEYDAN_PREBUILT: "1"
      HEYDAN_RETRY: "1"
      # No CLI grants notification permission on a Simulator that never ran the app (AGENTS.md); this test needs it.
      HEYDAN_SKIP_TESTS: HeyDanTests/MessageNotificationTests/communicationNotificationsAreEntitled()
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          simulator: true
      # Boots while the products download; nothing builds beside it in this job.
      - run: |
          udid=$(xcrun simctl list devices available -j | jq -r '.devices[][] | select(.name == "Hey Dan iPhone") | .udid')
          xcrun simctl boot "$udid"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sim-products
          path: ${{ runner.temp }}
      - run: tar -xpf "$RUNNER_TEMP/sim-products.tar"
      - run: python3 scripts/sim_tests.py "${{ matrix.mode }}" "Hey Dan iPhone" build com.example.HeyDan "${{ matrix.checks }}"
      - if: failure() && matrix.mode == 'sim-checks'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ strategy.job-index }}
          path: build/checks
          if-no-files-found: ignore
          retention-days: 7
