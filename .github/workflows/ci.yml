name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - docs/**
      - LICENSE
      - "*.example"
  push:
    branches: [main, "ci/**"]
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # One of the paths the xcode-27 image lists (actions/runner-images, images/macos/xcode-27-arm64-Readme.md).
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  JUST_VERSION: 1.59.0
  JUST_SHA256: 6574cea774ed4cae12e24b6aa11857de33e80dab4667cf628fd5840df96a2a9d
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  core:
    name: Core tests
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &tools
        name: Install just and XcodeGen
        run: |
          mkdir -p "$RUNNER_TEMP/tools/bin" && cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 3 -o just.tar.gz "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-aarch64-apple-darwin.tar.gz"
          curl -fsSL --retry 3 -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          printf '%s  %s\n' "$JUST_SHA256" just.tar.gz "$XCODEGEN_SHA256" xcodegen.zip | shasum -a 256 -c
          tar -xzf just.tar.gz -C bin just
          unzip -q xcodegen.zip
          echo "$PWD/bin" >> "$GITHUB_PATH"
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - &timeout
        # The image has no `timeout`; the Simulator scripts and two harness tests need it.
        name: Install GNU timeout
        run: brew install coreutils
      - run: just test

  build:
    name: Device build
    needs: core
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - *checkout
      - *tools
      - run: just build

  simulator:
    name: Simulator (${{ matrix.name }})
    needs: core
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app tests, chat, thread and pairing checks
            app-tests: true
            checks: ChatChecks ChatThreadChecks ChatPairingChecks
          - name: composer and call checks
            checks: ChatComposerChecks ChatCallChecks
    env:
      CHECKS: ${{ matrix.checks }}
      # Extra xcodebuild flags for every test run. One retry: an app launch can hang on these small runners. The
      # skips are what a Simulator that never ran the app cannot pass: the first needs the notification grant, which
      # no CLI gives (AGENTS.md); in the second the system photo picker shows no photo within the check's 10 s.
      HEYDAN_TEST_FLAGS: >-
        -retry-tests-on-failure -test-iterations 2
        -skip-testing:HeyDanTests/MessageNotificationTests/communicationNotificationsAreEntitled()
        -skip-testing:HeyDanChecks/ChatComposerChecks/testPhotosPicker
    steps:
      - *checkout
      - *tools
      - *timeout
      # One of the image's own Simulators: its first boot takes about 90 s, a created one's over 5 minutes. The
      # script boots it after the build, which takes two to three times as long beside a booted Simulator here.
      - name: Pick the Simulator
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          udid=$(xcrun simctl list devices available -j | jq -r --arg runtime "com.apple.CoreSimulator.SimRuntime.iOS-${sdk//./-}" \
            '.devices[$runtime][] | select(.name == "iPhone 18 Pro Max") | .udid')
          xcrun simctl rename "$udid" "Hey Dan iPhone"
      - name: App tests
        if: ${{ matrix.app-tests }}
        run: just app-test
      - name: UI checks
        run: for check in $CHECKS; do just sim-checks "$check"; done
