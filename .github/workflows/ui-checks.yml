# The fixture UI checks on a hosted runner, by hand only: they run locally before every merge.
name: UI checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: ${{ matrix.checks }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        checks:
          - ChatChecks ChatThreadChecks ChatPairingChecks
          - ChatComposerChecks ChatCallChecks ChatAgentSettingsChecks
    env:
      CHECKS: ${{ matrix.checks }}
      # On the runner's Simulator the system photo picker shows no photo within this check's 10 s.
      HEYDAN_SKIP_TESTS: HeyDanChecks/ChatComposerChecks/testPhotosPicker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          simulator: true
      - run: for check in $CHECKS; do just sim-checks "$check"; done
