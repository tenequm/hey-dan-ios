# Setup once per clone: lefthook install
pre-commit:
  commands:
    # Workflow YAML is only exercised by pushing it; actionlint also shellchecks every `run:` block.
    actions:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

# Materialize agent skills (gitignored) in fresh checkouts and worktrees
post-checkout:
  commands:
    kasetto:
      run: command -v kst >/dev/null 2>&1 && kst sync -q --color never || true
